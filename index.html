<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The NooB PM</title>
    <meta name="description" content="A comprehensive Product Management learning journey with interactive course roadmap, AI Mock Interview Studio, and AI LinkedIn Profile Optimiser." />
    <meta property="og:title" content="The NooB PM" />
    <meta property="og:description" content="A comprehensive Product Management learning journey with interactive course roadmap, AI Mock Interview Studio, and AI LinkedIn Profile Optimiser." />
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-217YK7FW0Y"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-217YK7FW0Y');
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // One brand accent: the landing page's forest green. Older indigo, blue, sky,
      // violet and purple classes resolve to it so the whole app shares one colour.
      (function () {
        var brand = {
          50: '#ECFDF5', 100: '#D1FAE5', 200: '#A7F3D0', 300: '#6EE7B7', 400: '#34D399',
          500: '#059669', 600: '#047857', 700: '#065F46', 800: '#064E3B', 900: '#043C2C', 950: '#022C22'
        };
        tailwind.config = {
          theme: { extend: {
            colors: { brand: brand, indigo: brand, blue: brand, sky: brand, violet: brand, purple: brand },
            // Headings were set in the heaviest weight almost everywhere; one step lighter reads calmer.
            fontWeight: { black: '800' }
          } }
        };
      })();
    </script>
    <style>
      :root {
        --brand: #047857;
      }
      html {
        font-size: 16px;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #fafaf9;
        color: #18181b;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        line-height: 1.6;
      }
      
      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #d6e3dc;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a7c4b5;
      }
      html {
        scrollbar-color: #d6e3dc transparent;
      }

      /* Browser surfaces carry the brand too: selection, caret, focus ring, links. */
      ::selection {
        background: #a7f3d0;
        color: #022c22;
      }
      input, textarea, [contenteditable="true"] {
        caret-color: #047857;
      }
      :focus-visible {
        outline: 2px solid #059669;
        outline-offset: 2px;
      }
      a {
        text-underline-offset: 3px;
      }
      h1, h2, h3 {
        text-wrap: balance;
      }
      p {
        text-wrap: pretty;
      }

      /* One easing for the whole app: quick start, soft landing. */
      :root {
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      }
      .page-transition {
        transition: opacity 0.3s var(--ease-out), transform 0.3s var(--ease-out);
      }
      button, a, [role="button"] {
        transition-timing-function: var(--ease-out);
      }

      /* The landing page's one authored moment: "NooB In." then "PM Out.", then the product settles into focus. */
      .hero-line {
        animation: hero-line-in 0.7s var(--ease-out) both;
      }
      .hero-line-2 {
        animation-delay: 0.16s;
      }
      .hero-shot {
        animation: hero-shot-in 0.9s var(--ease-out) 0.32s both;
      }
      @keyframes hero-line-in {
        from { opacity: 0; transform: translateY(0.35em); clip-path: inset(0 0 100% 0); }
        to { opacity: 1; transform: none; clip-path: inset(-10% -5% -15% -5%); }
      }
      @keyframes hero-shot-in {
        from { opacity: 0; transform: translateY(14px) scale(0.985); filter: blur(8px); }
        to { opacity: 1; transform: none; filter: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          animation-delay: 0s !important;
          scroll-behavior: auto !important;
        }
      }

      h1, h2, h3, h4 {
        letter-spacing: -0.025em;
        font-weight: 800;
      }

      /* Small uppercase labels inside lesson boxes keep their own size and spacing. */
      .prose h1:not(.uppercase) { font-size: 2.5rem !important; margin-bottom: 2rem !important; }
      .prose h2:not(.uppercase) { font-size: 1.875rem !important; margin-top: 2.5rem !important; margin-bottom: 1.25rem !important; }
      .prose h3:not(.uppercase) { font-size: 1.5rem !important; margin-top: 2rem !important; margin-bottom: 1rem !important; }
      
      .prose p:not(.uppercase) {
        font-size: 1.125rem !important;
        line-height: 1.7 !important;
        color: #3f3f46 !important;
        margin-bottom: 1.5rem !important;
        max-width: 75ch;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .clip-path-arrow {
        clip-path: polygon(0% 0%, 85% 0%, 100% 50%, 85% 100%, 0% 100%, 15% 50%);
      }

      @keyframes marquee-scroll {
        0% {
          transform: translate3d(0, 0, 0);
        }
        100% {
          transform: translate3d(-50%, 0, 0);
        }
      }

      .animate-marquee {
        display: flex;
        width: max-content;
        animation: marquee-scroll 55s linear infinite;
        will-change: transform;
      }

      .animate-marquee:hover,
      .marquee-container:hover .animate-marquee {
        animation-play-state: paused;
      }

      @media (prefers-reduced-motion: reduce) {
        .animate-marquee {
          animation-play-state: paused;
        }
      }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
