    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --brand-indigo: #6366f1;
      }
      html {
        font-size: 16px;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #fcfdfe;
        color: #18181b;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        line-height: 1.6;
      }
      
      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #cbd5e1;
      }

      .page-transition {
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      h1, h2, h3, h4 {
        letter-spacing: -0.025em;
        font-weight: 800;
      }

      .prose h1 { font-size: 2.5rem !important; margin-bottom: 2rem !important; }
      .prose h2 { font-size: 1.875rem !important; margin-top: 2.5rem !important; margin-bottom: 1.25rem !important; }
      .prose h3 { font-size: 1.5rem !important; margin-top: 2rem !important; margin-bottom: 1rem !important; }
      
      .prose p {
        font-size: 1.125rem !important;
        line-height: 1.7 !important;
        color: #3f3f46 !important;
        margin-bottom: 1.5rem !important;
        max-width: 75ch;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .clip-path-arrow {
        clip-path: polygon(0% 0%, 85% 0%, 100% 50%, 85% 100%, 0% 100%, 15% 50%);
      }
    </style>
